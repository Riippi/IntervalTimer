<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Running — landscape</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 844px; height: 390px; overflow: hidden; font-family: Inter, system-ui, sans-serif">
  <dc-import name="Run" start-at="{{at}}" landscape="{{land}}" hint-size="844px,390px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":844,"height":390}}'>
class Component extends DCLogic {
  renderVals() {
    return { at: 196, land: true };
  }
}
</script>
</body>
</html>

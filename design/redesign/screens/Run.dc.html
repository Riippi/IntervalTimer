<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Running timer</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
button{-webkit-tap-highlight-color:transparent}
</style>
</helmet>
<div style="font-family: Inter, system-ui, sans-serif">

  <sc-if value="{{portrait}}" hint-placeholder-val="{{ true }}">
    <div style="{{rootStyle}}">
      <div style="height: 72px; display: flex; align-items: center; justify-content: space-between">
        <span style="font-size: 16px; font-weight: 600; color: rgba(0, 0, 0, 0.72)">{{workoutName}}</span>
        <button aria-label="End workout" onClick="{{stop}}" style="width: 48px; height: 48px; border-radius: 24px; border: none; background: rgba(0, 0, 0, 0.12); color: #0A0A0A; display: flex; align-items: center; justify-content: center; cursor: pointer">
          <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg>
        </button>
      </div>

      <div style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center">
        <span style="font: 700 64px/1 'Space Grotesk', sans-serif; letter-spacing: 0.04em">{{phaseLabel}}</span>
        <span style="font: 600 24px/1.2 Inter, sans-serif; margin-top: 14px">{{roundText}}</span>
        <span role="timer" aria-live="off" style="{{digitStyle}}">{{clock}}</span>
        <span style="font: 500 20px/1.2 Inter, sans-serif; margin-top: 18px; color: rgba(0, 0, 0, 0.72)">{{nextText}}</span>
        <sc-if value="{{paused}}" hint-placeholder-val="{{ false }}">
          <span style="margin-top: 14px; padding: 6px 14px; border-radius: 999px; background: #0A0A0A; color: #F5F5F5; font: 700 14px/1 Inter, sans-serif; letter-spacing: 0.1em">PAUSED</span>
        </sc-if>
      </div>

      <div role="img" aria-label="Workout progress" style="display: flex; gap: 4px; height: 10px">
        <sc-for list="{{segs}}" as="seg" hint-placeholder-count="8">
          <span style="{{seg.style}}"><span style="{{seg.fill}}"></span></span>
        </sc-for>
      </div>
      <div style="display: flex; justify-content: space-between; margin-top: 14px">
        <div style="display: flex; flex-direction: column; gap: 4px">
          <span style="font: 700 12px/1 Inter, sans-serif; letter-spacing: 0.08em; color: rgba(0, 0, 0, 0.72)">ELAPSED</span>
          <span style="font: 600 26px/1 'Space Grotesk', sans-serif; font-variant-numeric: tabular-nums">{{elapsed}}</span>
        </div>
        <div style="display: flex; flex-direction: column; gap: 4px; align-items: flex-end">
          <span style="font: 700 12px/1 Inter, sans-serif; letter-spacing: 0.08em; color: rgba(0, 0, 0, 0.72)">REMAINING</span>
          <span style="font: 600 26px/1 'Space Grotesk', sans-serif; font-variant-numeric: tabular-nums">{{remaining}}</span>
        </div>
      </div>

      <div style="display: flex; align-items: center; gap: 12px; margin-top: 22px">
        <button aria-label="Previous phase" onClick="{{prev}}" style="flex: none; width: 64px; height: 64px; border-radius: 32px; border: none; background: rgba(0, 0, 0, 0.14); color: #0A0A0A; display: flex; align-items: center; justify-content: center; cursor: pointer">
          <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><rect x="5" y="5" width="2.6" height="14" rx="1"></rect><path d="M19 5.5v13L9 12z"></path></svg>
        </button>
        <button onClick="{{toggle}}" style="flex: 1; height: 72px; border-radius: 36px; border: none; background: #0A0A0A; color: #F5F5F5; display: flex; align-items: center; justify-content: center; gap: 10px; font: 700 20px/1 'Space Grotesk', sans-serif; letter-spacing: 0.06em; cursor: pointer">
          <sc-if value="{{showPause}}" hint-placeholder-val="{{ true }}">
            <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"></rect><rect x="14" y="5" width="4" height="14" rx="1"></rect></svg>
          </sc-if>
          <sc-if value="{{showPlay}}" hint-placeholder-val="{{ false }}">
            <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13l11-6.5z"></path></svg>
          </sc-if>
          {{toggleLabel}}
        </button>
        <button aria-label="Next phase" onClick="{{next}}" style="flex: none; width: 64px; height: 64px; border-radius: 32px; border: none; background: rgba(0, 0, 0, 0.14); color: #0A0A0A; display: flex; align-items: center; justify-content: center; cursor: pointer">
          <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M5 5.5v13L15 12z"></path><rect x="16.4" y="5" width="2.6" height="14" rx="1"></rect></svg>
        </button>
      </div>
    </div>
  </sc-if>

  <sc-if value="{{landscape}}" hint-placeholder-val="{{ false }}">
    <div style="{{rootStyle}}">
      <div style="display: flex; align-items: center; justify-content: space-between; height: 56px">
        <div style="display: flex; align-items: baseline; gap: 16px">
          <span style="font: 700 44px/1 'Space Grotesk', sans-serif; letter-spacing: 0.04em">{{phaseLabel}}</span>
          <span style="font: 600 22px/1 Inter, sans-serif">{{roundText}}</span>
        </div>
        <button aria-label="End workout" onClick="{{stop}}" style="width: 48px; height: 48px; border-radius: 24px; border: none; background: rgba(0, 0, 0, 0.12); color: #0A0A0A; display: flex; align-items: center; justify-content: center; cursor: pointer">
          <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg>
        </button>
      </div>

      <div style="flex: 1; display: flex; align-items: center; gap: 24px; min-height: 0">
        <div style="flex: 1; display: flex; justify-content: center; align-items: center; min-width: 0">
          <span role="timer" aria-live="off" style="{{digitStyle}}">{{clock}}</span>
        </div>
        <div style="flex: none; width: 236px; display: flex; flex-direction: column; gap: 14px">
          <span style="font: 500 18px/1.25 Inter, sans-serif; color: rgba(0, 0, 0, 0.72)">{{nextText}}</span>
          <div style="display: flex; flex-direction: column; gap: 4px">
            <span style="font: 700 12px/1 Inter, sans-serif; letter-spacing: 0.08em; color: rgba(0, 0, 0, 0.72)">REMAINING</span>
            <span style="font: 600 30px/1 'Space Grotesk', sans-serif; font-variant-numeric: tabular-nums">{{remaining}}</span>
          </div>
          <div style="display: flex; align-items: center; gap: 8px">
            <button aria-label="Previous phase" onClick="{{prev}}" style="flex: none; width: 52px; height: 52px; border-radius: 26px; border: none; background: rgba(0, 0, 0, 0.14); color: #0A0A0A; display: flex; align-items: center; justify-content: center; cursor: pointer">
              <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><rect x="5" y="5" width="2.6" height="14" rx="1"></rect><path d="M19 5.5v13L9 12z"></path></svg>
            </button>
            <button onClick="{{toggle}}" style="flex: 1; height: 60px; border-radius: 30px; border: none; background: #0A0A0A; color: #F5F5F5; font: 700 17px/1 'Space Grotesk', sans-serif; letter-spacing: 0.06em; cursor: pointer">{{toggleLabel}}</button>
            <button aria-label="Next phase" onClick="{{next}}" style="flex: none; width: 52px; height: 52px; border-radius: 26px; border: none; background: rgba(0, 0, 0, 0.14); color: #0A0A0A; display: flex; align-items: center; justify-content: center; cursor: pointer">
              <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M5 5.5v13L15 12z"></path><rect x="16.4" y="5" width="2.6" height="14" rx="1"></rect></svg>
            </button>
          </div>
        </div>
      </div>

      <div role="img" aria-label="Workout progress" style="display: flex; gap: 4px; height: 10px; margin-top: 8px">
        <sc-for list="{{segs}}" as="seg" hint-placeholder-count="8">
          <span style="{{seg.style}}"><span style="{{seg.fill}}"></span></span>
        </sc-for>
      </div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"startAt":{"editor":"int","default":196,"min":0,"max":840},"landscape":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(...a) {
    super(...a);
    this.state = { elapsed: null, ticking: false, paused: false };
    this.cfg = { name: 'Boxing 4×2', warm: 180, rounds: 4, work: 120, rest: 60 };
  }
  componentWillUnmount() { clearInterval(this.iv); }
  fmt(s) { const m = Math.floor(s / 60); const r = s % 60; return m + ':' + String(r).padStart(2, '0'); }
  phases() {
    const c = this.cfg; const out = [];
    if (c.warm > 0) out.push({ k: 'warm', d: c.warm, round: 1 });
    for (let r = 0; r < c.rounds; r++) {
      out.push({ k: 'work', d: c.work, round: r + 1 });
      if (r < c.rounds - 1 && c.rest > 0) out.push({ k: 'rest', d: c.rest, round: r + 2 });
    }
    return out;
  }
  el() { return this.state.elapsed == null ? (this.props.startAt ?? 196) : this.state.elapsed; }
  starts() { let acc = 0; return this.phases().map((p) => { const s = acc; acc += p.d; return s; }); }
  locate(el) {
    const ph = this.phases(); let acc = 0;
    for (let i = 0; i < ph.length; i++) { if (el < acc + ph[i].d) return { i, left: acc + ph[i].d - el }; acc += ph[i].d; }
    return { i: ph.length, left: 0 };
  }
  total() { return this.phases().reduce((a, p) => a + p.d, 0); }
  run() {
    clearInterval(this.iv);
    this.iv = setInterval(() => {
      const e = this.el() + 1;
      if (e >= this.total()) { clearInterval(this.iv); this.setState({ elapsed: this.total(), ticking: false, paused: false }); return; }
      this.setState({ elapsed: e });
    }, 1000);
  }
  renderVals() {
    const ph = this.phases();
    const tot = this.total();
    const el = Math.min(this.el(), tot);
    const loc = this.locate(el);
    const done = loc.i >= ph.length;
    const cur = done ? null : ph[loc.i];
    const k = done ? 'done' : cur.k;
    const COL = { warm: '#FFD60A', work: '#2BE04F', rest: '#FF3B30', done: '#EDEEEF' };
    const LAB = { warm: 'WARM-UP', work: 'WORK', rest: 'REST', done: 'DONE' };
    const NAME = { warm: 'Warm-up', work: 'Work', rest: 'Rest' };
    const c = this.cfg;
    const land = !!this.props.landscape;

    let roundText = '';
    if (k === 'warm') roundText = 'Get ready · ' + c.rounds + ' rounds';
    else if (k === 'work') roundText = 'Round ' + cur.round + ' of ' + c.rounds;
    else if (k === 'rest') roundText = 'Next: round ' + cur.round + ' of ' + c.rounds;
    else roundText = c.rounds + ' rounds complete';

    const nx = done ? null : ph[loc.i + 1];
    const nextText = done ? 'Great work' : (nx ? 'Next: ' + NAME[nx.k] + ' ' + this.fmt(nx.d) : 'Last one — finish strong');

    const clock = done ? this.fmt(tot) : this.fmt(loc.left);
    const long = clock.length > 4;
    const size = land ? (long ? 200 : 250) : (long ? 140 : 180);
    const digitStyle = 'font: 700 ' + size + 'px/0.88 \'Space Grotesk\', sans-serif; font-variant-numeric: tabular-nums; letter-spacing: -0.05em; white-space: nowrap; ' + (land ? '' : 'margin-top: 26px; ') + (this.state.paused ? 'opacity: 0.45;' : '');

    const segs = ph.map((p, j) => {
      const pct = j < loc.i ? 100 : (j === loc.i ? Math.round(((p.d - loc.left) / p.d) * 100) : 0);
      return {
        style: 'flex: ' + p.d + ' 1 0px; height: 100%; border-radius: 5px; background: rgba(0, 0, 0, 0.18); position: relative; overflow: hidden',
        fill: 'position: absolute; left: 0; top: 0; bottom: 0; width: ' + pct + '%; background: #0A0A0A'
      };
    });

    const rootStyle = (land
      ? 'width: 844px; height: 390px; padding: 12px 24px 20px 32px;'
      : 'width: 390px; height: 844px; padding: 0 20px 24px;') +
      ' box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden; color: #0A0A0A; background: ' + COL[k] + '; transition: background-color 0.35s ease';

    const st = this.starts();
    const jump = (t) => this.setState({ elapsed: Math.max(0, Math.min(tot, t)) });

    return {
      portrait: !land, landscape: land, rootStyle, digitStyle, segs, clock, roundText, nextText,
      workoutName: c.name,
      phaseLabel: LAB[k],
      elapsed: this.fmt(el),
      remaining: this.fmt(tot - el),
      paused: this.state.paused,
      toggleLabel: done ? 'RESTART' : (this.state.paused ? 'RESUME' : 'PAUSE'),
      showPause: !done && !this.state.paused,
      showPlay: done || this.state.paused,
      toggle: () => {
        if (this.locate(this.el()).i >= this.phases().length) { this.setState({ elapsed: 0, ticking: true, paused: false }, () => this.run()); return; }
        if (this.state.paused) { this.setState({ paused: false, ticking: true }, () => this.run()); }
        else { clearInterval(this.iv); this.setState({ paused: true, ticking: false, elapsed: this.el() }); }
      },
      prev: () => {
        const e = this.el(); const l = this.locate(e);
        const i = Math.min(l.i, st.length - 1);
        jump(e - st[i] > 2 || i === 0 ? st[i] : st[i - 1]);
      },
      next: () => { const l = this.locate(this.el()); jump(l.i + 1 < st.length ? st[l.i + 1] : tot); },
      stop: () => { clearInterval(this.iv); this.setState({ elapsed: 0, ticking: false, paused: true }); }
    };
  }
}
</script>
</body>
</html>
